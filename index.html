<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HOLIDOLA — Telegram Shop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: #121212;
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.8);
            border: 1px solid #2a2a2a;
        }

        .avatar {
            width: 80px;
            height: 80px;
            background: #1e1e1e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid #2c2c2c;
        }

        .avatar span {
            font-size: 42px;
            font-weight: 500;
            color: #b0b0b0;
        }

        .name {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            color: #f5f5f5;
        }

        .username {
            font-size: 16px;
            color: #888;
            margin-bottom: 20px;
            border-bottom: 1px dashed #2a2a2a;
            padding-bottom: 16px;
        }

        .bio {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 24px;
            font-size: 14px;
            line-height: 1.5;
            color: #ccc;
            border-left: 3px solid #3a3a3a;
        }

        .services {
            margin-bottom: 28px;
        }

        .service-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 12px 0;
            border-bottom: 1px solid #222;
        }

        .service-name {
            font-size: 16px;
            font-weight: 500;
        }

        .service-price {
            font-family: monospace;
            font-size: 16px;
            color: #b0b0b0;
        }

        .badge {
            background: #1f1f1f;
            padding: 8px 12px;
            border-radius: 40px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            margin-bottom: 24px;
        }

        .button {
            display: block;
            background: #2c2c2c;
            text-align: center;
            padding: 14px;
            border-radius: 60px;
            font-weight: 600;
            text-decoration: none;
            color: #fff;
            font-size: 16px;
            transition: 0.2s;
            margin-bottom: 16px;
            border: 1px solid #3a3a3a;
        }

        .button:hover {
            background: #3a3a3a;
        }

        .footer {
            font-size: 12px;
            color: #555;
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #fff;
            text-decoration: none;
        }

        .ton {
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">
            <span>H</span>
        </div>
        <div class="name">HOLIDOLA</div>
        <div class="username">@holirov</div>

        <div class="bio">
            ★ продажа услуг в Telegram<br>
            моментальная выдача / 24/7
        </div>

        <div class="services">
            <div class="service-item">
                <span class="service-name">⭐ Звёзды</span>
                <span class="service-price">1 ⭐ = 1.33 ₽</span>
            </div>
            <div class="service-item">
                <span class="service-name">💰 TON</span>
                <span class="service-price">от 130 ₽</span>
            </div>
            <div class="service-item">
                <span class="service-name">👑 Telegram Premium</span>
                <span class="service-price">от 1200 ₽</span>
            </div>
            <div class="service-item">
                <span class="service-name">🎁 NFT / подарки</span>
                <span class="service-price">аренда / покупка</span>
            </div>
            <div class="service-item">
                <span class="service-name">📱 анонимные номера</span>
                <span class="service-price">1 день — 400 ₽</span>
            </div>
        </div>

        <div class="badge">
            ⚡ моментальная выдача | 3 дня поддержки
        </div>

        <a href="https://t.me/HolidolaStarsBot" class="button" target="_blank">
            📦 ПЕРЕЙТИ В БОТ
        </a>

        <div class="footer">
            HOLIDOLA — работаем с 2025
        </div>
    </div>
</body>
</html>
